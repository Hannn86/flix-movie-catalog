<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLIX — Temukan Film Favoritmu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Sora:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <script>
        // Set tema SEBELUM halaman render (hindari flicker)
        document.documentElement.setAttribute('data-theme', localStorage.getItem('flix_theme') || 'dark');
    </script>
</head>
<body>
    <div class="deco" style="width:350px;height:350px;background:rgba(255,122,80,.06);top:-80px;left:-80px;animation:glow-pulse 5s ease-in-out infinite"></div>
    <div class="deco" style="width:280px;height:280px;background:rgba(80,200,255,.04);bottom:5%;right:-60px;animation:glow-pulse 6s ease-in-out infinite 1.5s"></div>
    <div class="toast-c" id="toasts"></div>

    <header id="hdr">
        <div class="hdr-inner">
            <a href="#" onclick="goHome();return false" class="logo-flix">
                <span class="letter">F</span><span class="letter">L</span><span class="letter">I</span><span class="letter-x">X</span>
            </a>
            <div class="s-wrap">
                <i class="fas fa-search s-i"></i>
                <input type="text" id="sInput" placeholder="Cari film..." oninput="onSearch(this.value)" autocomplete="off">
                <button class="s-c" id="sClear" onclick="clearS()"><i class="fas fa-times"></i></button>
            </div>
            <button class="theme-btn" onclick="toggleTheme()" title="Ganti Tema (Ctrl+D)">
                <i class="fas fa-sun t-icon t-sun"></i>
                <i class="fas fa-moon t-icon t-moon"></i>
            </button>
            <div id="authArea"></div>
        </div>
    </header>

    <main>
        <section class="hero" id="heroSec">
            <div class="hero-bg" id="heroBg"></div>
            <div class="hero-watermark">FLI<span class="wm-x">X</span></div>
            <div class="hero-inner">
                <div id="heroBody" class="hero-content"></div>
                <div class="hero-dots" id="heroDots"></div>
            </div>
        </section>
        <section class="section-padded"><div class="pills" id="genreBar"></div></section>
        <section class="section-padded" style="padding-top:0"><div class="tabs" id="tabBar"></div></section>
        <section class="section-padded" style="padding-top:28px">
            <div id="grid" class="film-grid"></div>
            <div id="skelGrid" class="film-grid"></div>
        </section>
        <div id="emptyState" class="empty">
            <div class="empty-icon"><i class="fas fa-film"></i></div>
            <h3>Film Tidak Ditemukan</h3>
            <p>Coba kata kunci lain atau jelajahi kategori yang tersedia.</p>
        </div>
        <section class="section-padded" style="padding-top:12px;padding-bottom:56px">
            <div id="pageWrap" class="page-wrap"></div>
        </section>
    </main>

    <footer>
        <p>Data film oleh <a href="https://www.themoviedb.org" target="_blank" rel="noopener">TMDB</a> &mdash;
        <span class="logo-flix" style="font-size:14px"><span class="letter" style="font-size:14px">F</span><span class="letter" style="font-size:14px">L</span><span class="letter" style="font-size:14px">I</span><span class="letter-x" style="font-size:14px">X</span></span> 2025</p>
    </footer>

    <!-- Modal Detail -->
    <div class="m-bg" id="modal" onclick="if(event.target===this)closeM()"><div class="m-box" id="mBox"></div></div>

    <!-- Modal Watchlist -->
    <div class="m-bg" id="wlModal" onclick="if(event.target===this)closeWlModal()">
        <div class="m-box" style="max-width:700px" id="wlBox">
            <div style="padding:22px 26px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between">
                <h2 style="font-size:20px;font-weight:800"><i class="fas fa-bookmark" style="color:var(--accent);margin-right:8px;font-size:16px"></i>Watchlist</h2>
                <button onclick="closeWlModal()" class="m-close" style="position:static"><i class="fas fa-times"></i></button>
            </div>
            <div id="wlContent" style="padding:24px 26px;max-height:60vh;overflow-y:auto"></div>
        </div>
    </div>

    <!-- Modal Favorit -->
    <div class="m-bg" id="favModal" onclick="if(event.target===this)closeFavModal()">
        <div class="m-box" style="max-width:700px" id="favBox">
            <div style="padding:22px 26px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between">
                <h2 style="font-size:20px;font-weight:800"><i class="fas fa-heart" style="color:var(--red);margin-right:8px;font-size:16px"></i>Favorit</h2>
                <button onclick="closeFavModal()" class="m-close" style="position:static"><i class="fas fa-times"></i></button>
            </div>
            <div id="favContent" style="padding:24px 26px;max-height:60vh;overflow-y:auto"></div>
        </div>
    </div>

    <!-- Modal Auth -->
    <div class="m-bg" id="authModal" onclick="if(event.target===this)closeAuthModal()">
        <div class="m-box" style="max-width:420px" id="authBox"></div>
    </div>

    <!-- Modal Profile -->
    <div class="m-bg" id="profileModal" onclick="if(event.target===this)closeProfile()">
        <div class="m-box" style="max-width:650px" id="profileBox"></div>
    </div>

        <!-- Lightbox Poster -->
    <div class="lightbox-bg" id="lightbox" onclick="this.classList.remove('open')">
        <img id="lightboxImg" src="" alt="">
    </div>

        <!-- Emoji Picker Modal -->
    <div class="emoji-overlay" id="emojiOverlay" onclick="closeEmoji()">
        <div class="emoji-modal" onclick="event.stopPropagation()">
            <div class="emoji-modal-header">
                <h4><span style="font-size:18px">😀</span> Pilih Emoticon</h4>
                <button class="emoji-close" onclick="closeEmoji()"><i class="fas fa-times"></i></button>
            </div>
            <div class="emoji-grid">
                <button class="emoji-item" onclick="pickEmoji('😀')">😀</button>
                <button class="emoji-item" onclick="pickEmoji('😂')">😂</button>
                <button class="emoji-item" onclick="pickEmoji('🥰')">🥰</button>
                <button class="emoji-item" onclick="pickEmoji('😎')">😎</button>
                <button class="emoji-item" onclick="pickEmoji('🤩')">🤩</button>
                <button class="emoji-item" onclick="pickEmoji('😋')">😋</button>
                <button class="emoji-item" onclick="pickEmoji('🤔')">🤔</button>
                <button class="emoji-item" onclick="pickEmoji('😢')">😢</button>
                <button class="emoji-item" onclick="pickEmoji('😤')">😤</button>
                <button class="emoji-item" onclick="pickEmoji('🥺')">🥺</button>
                <button class="emoji-item" onclick="pickEmoji('😱')">😱</button>
                <button class="emoji-item" onclick="pickEmoji('🤯')">🤯</button>
                <button class="emoji-item" onclick="pickEmoji('👍')">👍</button>
                <button class="emoji-item" onclick="pickEmoji('👎')">👎</button>
                <button class="emoji-item" onclick="pickEmoji('👏')">👏</button>
                <button class="emoji-item" onclick="pickEmoji('🙏')">🙏</button>
                <button class="emoji-item" onclick="pickEmoji('🔥')">🔥</button>
                <button class="emoji-item" onclick="pickEmoji('❤️')">❤️</button>
                <button class="emoji-item" onclick="pickEmoji('💀')">💀</button>
                <button class="emoji-item" onclick="pickEmoji('👀')">👀</button>
                <button class="emoji-item" onclick="pickEmoji('🎬')">🎬</button>
                <button class="emoji-item" onclick="pickEmoji('🍿')">🍿</button>
                <button class="emoji-item" onclick="pickEmoji('⭐')">⭐</button>
                <button class="emoji-item" onclick="pickEmoji('💯')">💯</button>
                <button class="emoji-item" onclick="pickEmoji('🦸')">🦸</button>
                <button class="emoji-item" onclick="pickEmoji('🎭')">🎭</button>
                <button class="emoji-item" onclick="pickEmoji('✅')">✅</button>
                <button class="emoji-item" onclick="pickEmoji('❌')">❌</button>
                <button class="emoji-item" onclick="pickEmoji('💬')">💬</button>
            </div>
            <div class="emoji-footer">Klik emoticon untuk menyisipkan ke komentar</div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/db.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
